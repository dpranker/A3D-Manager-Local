# Desktop packaging: npm run electron:build (builds for the current OS; Linux -> AppImage)
appId: com.dpranker.a3dmanagerlocal
productName: A3D Manager
executableName: a3d-manager-local
artifactName: A3D-Manager-Local-${version}-${arch}.${ext}

directories:
  output: release

# App icon (generated by electron/scripts/make-icons.ts); Windows .ico / macOS icons are derived from it
icon: electron/resources/icon.png

files:
  - package.json
  - dist/**/*
  - dist-electron/**/*
  - "!dist-electron/*.map"
  # Window icon at runtime (see main.ts)
  - electron/resources/icons/256x256.png

# Wayland app_id / WM_CLASS, so the window matches the generated .desktop entry
extraMetadata:
  desktopName: a3d-manager-local.desktop
  description: Desktop companion app for managing Analogue 3D SD cards (labels, settings, game paks, firmware)
  author: dpranker

# Server reads data/ from its working directory; main.ts copies it to userData
extraResources:
  - from: data
    to: data

# sharp is a native module (Node-API, so no ABI-specific rebuild is needed, but
# its .node binaries and libvips must live outside the asar archive)
asarUnpack:
  - node_modules/sharp/**/*
  - node_modules/@img/**/*

linux:
  target: AppImage
  icon: electron/resources/icons
  syncDesktopName: true
  category: Utility

win:
  target: nsis

mac:
  target: dmg
  category: public.app-category.utilities
